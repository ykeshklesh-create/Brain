if(ct&&!classes.includes(ct))f.classes.push(ct);
const fin=ph=>{let t=e;if(!e){t={id,role:"teacher",pw};D.staff.push(t)}Object.assign(t,f);if(ph)t.photo=ph;D.classes.forEach(c=>{if(c.teacher==t.id)delete c.teacher});if(ct)D.classes.find(c=>c.id==ct).teacher=t.id;
if(e)FLASH=name+" was updated.";else LAST={name,id,pw,kind:"Teacher"};ET=-1;save();render()},file=$("#tph")&&$("#tph").files[0];file?readImg(file,400,fin):fin("")}
function addClass(){if(!canEdit())return;const id=$("#cid").value.trim().toUpperCase(),nm=$("#cnm").value.trim(),g=$("#cg").value,fe=+$("#cfe").value||0,ct=$("#cct").value;
if(!/^[A-Z0-9]{1,8}$/.test(id)||!nm){alert("Enter a Class ID (letters and numbers only, up to 8) and a class name.");return}
if(D.classes.some(c=>c.id==id)){alert("A class with that ID already exists.");return}
D.classes.push({id,name:nm,g});D.fees[id]=fe;if(ct){D.classes.find(c=>c.id==id).teacher=ct;const t=D.staff.find(x=>x.id==ct);if(t&&!(t.classes||[]).includes(id))(t.classes=t.classes||[]).push(id)}
FLASH="Class "+nm+" ("+id+") was added.";save();render()}
function renClass(i,v){if(!canEdit())return;v=v.trim();if(v)D.classes[i].name=v;save();render()}
function setLvl(i,v){if(!canEdit())return;D.classes[i].g=v;save();render()}
function setCT(i,v){if(!canEdit())return;const c=D.classes[i];if(v){c.teacher=v;const t=D.staff.find(x=>x.id==v);if(t&&!(t.classes||[]).includes(c.id))(t.classes=t.classes||[]).push(c.id)}else delete c.teacher;save();render()}
function rmClass(i){if(!canEdit())return;const c=D.classes[i],n=D.pupils.filter(p=>p.cls==c.id).length;if(D.classes.length<2){alert("The school needs at least one class.");return}
if(n){alert("Class "+c.name+" still has "+n+" pupil"+(n>1?"s":"")+". Move or remove them first.");return}
if(!confirm("Remove class "+c.name+" ("+c.id+")? Its timetable and fee amount are removed too."))return;D.classes.splice(i,1);delete D.fees[c.id];D.tt=D.tt.filter(t=>t.cls!=c.id);D.staff.forEach(x=>{if(x.classes)x.classes=x.classes.filter(k=>k!=c.id)});save();render()}
function setCls(i,v){if(!canGen())return;D.pupils[i].cls=v;save();render()}
function setTT(c,d,tm,v){v=v.trim();D.tt=D.tt.filter(x=>!(x.cls==c&&x.day==d&&x.time==tm));if(v)D.tt.push({cls:c,day:d,time:tm,subject:v});save()}
function addSlot(){const v=$("#sl").value;if(!v)return;if(!D.slots.includes(v))D.slots.push(v);D.slots.sort();save();render()}
function rmSlot(tm){if(D.tt.some(x=>x.time==tm)){alert("There are lessons at "+tm+". Clear them first, then remove the row.");return}D.slots=D.slots.filter(x=>x!=tm);save();render()}
function addP(){const v=i=>($("#n"+i)||{value:""}).value.trim(),gen=canGen()&&$("#n5"),name=v(1),id=v(2),em=v(6),pw=gen?v(5):"";
if(!name||!id||!v(3)){alert("Enter the pupil's name, class and login ID.");return}
if(!okId(id)){alert("Login ID can use letters, numbers, dots, dashes and underscores (2 to 20 characters).");return}
if(gen&&pw.length<6){alert("Password must be at least 6 characters.");return}
if(taken(id,em)){alert("That login ID or email is already used.");return}
D.pupils.push({id,name,cls:v(3),dob:v(4),pw,email:em,photo:"",pics:[],paid:0,blocked:false,att:{},marks:{}});
if(gen)LAST={name,id,pw,kind:"Pupil"};else FLASH=name+" was added with ID "+id+". The bursar will create the login.";save();render()}
function rmP(i){if(!canRm())return;if(confirm("Remove "+D.pupils[i].name+"? This cannot be undone.")){D.pupils.splice(+i,1);save();render()}}
function togM(i){if(!canGen())return;D.pupils[i].blocked=!D.pupils[i].blocked;save();render()}
function filtP(){const q=$("#ps").value.trim().toLowerCase(),c=$("#pc").value;document.querySelectorAll("#pt tr[data-s]").forEach(r=>{r.hidden=!((!q||r.dataset.s.includes(q))&&(!c||r.dataset.c==c))})}
function mk(el){MK[JSON.stringify([el.dataset.id,el.dataset.s,el.dataset.k])]={id:el.dataset.id,s:el.dataset.s,f:el.dataset.k,v:el.value};const tr=el.closest("tr"),v=[...tr.querySelectorAll("input")].map(i=>i.value).filter(x=>x!=="").map(Number);tr.querySelector(".mav").textContent=v.length?+(v.reduce((x,y)=>x+y)/v.length).toFixed(1):"-";el.style.borderColor=el.value!==""&&(isNaN(+el.value)||+el.value<0||+el.value>100)?"var(--bad)":"";$("#mkst").textContent="Unsaved changes"}
function saveMarks(){const L=Object.values(MK);if(!L.length){FLASH="Nothing to save. No marks were changed.";render();return}
if(L.some(x=>x.v!==""&&(isNaN(+x.v)||+x.v<0||+x.v>100))){alert("Marks must be numbers from 0 to 100. Check the boxes marked red.");return}
L.forEach(x=>{const p=D.pupils.find(q=>q.id==x.id);if(!p||(U.role=="teacher"&&!me().classes.includes(p.cls)))return;const m=p.marks[x.s]=p.marks[x.s]||{};if(x.v==="")delete m[x.f];else m[x.f]=Math.round(+x.v*10)/10;if(m.test==null&&m.exam==null)delete p.marks[x.s]});
MK={};save();FLASH="Marks saved ("+L.length+" changes).";render()}
function attNav(fn){if(ADIRTY&&!confirm("You have ticks that are not saved. Leave without saving?"))return;ADIRTY=0;fn()}
function colAll(el,d){document.querySelectorAll('#app input[data-d="'+d+'"]:not(:disabled)').forEach(i=>i.checked=el.checked);ADIRTY=1}
function saveAtt(){document.querySelectorAll("#app input[data-d]:not(:disabled)").forEach(i=>{const p=D.pupils.find(x=>x.id==i.dataset.id);if(p)p.att[i.dataset.d]=i.checked});ADIRTY=0;save();FLASH="Attendance saved for the week.";render()}
function saveProf(){const m=me(),n=$("#pn").value.trim(),e=$("#pe").value.trim(),ph=$("#pph").value.trim();if(!n){alert("Your name cannot be empty.");return}
if(e&&taken(e,e,m)){alert("That email is already used by another account.");return}
D.media.forEach(x=>{if(x.by==m.name)x.by=n});m.name=n;m.email=e;m.phone=ph;save();FLASH="Your details were saved.";render()}
function savePw(){const m=me(),o=$("#po").value,a=$("#pn1").value,b=$("#pn2").value;if(o!==m.pw){alert("Your current password is wrong.");return}if(a.length<6){alert("The new password must be at least 6 characters.");return}if(a!==b){alert("The two new passwords do not match.");return}m.pw=a;save();FLASH="Password changed. Use the new one next time you sign in.";render()}
function myPhoto(){const f=$("#myf").files[0];if(!f){alert("Choose a photo first.");return}readImg(f,400,x=>{me().photo=x;save();FLASH="Photo saved.";render()})}
const dbBase=()=>($("#dbu").value.trim()||"/api").replace(/\/+$/,"");
async function dbTest(){if(U.role!="dev")return;const b=dbBase();DBMSG="Testing...";render();try{const r=await fetch(b+"/state",{cache:"no-store"});if(!r.ok)throw 0;const j=await r.json();DBMSG=j.empty?"Connected. The database is empty.":"Connected. The database holds "+(j.pupils||[]).length+" pupils and "+(j.staff||[]).length+" staff."}catch(e){DBMSG="Could not reach a database at "+b+". Check the address and that server.py is running."}render()}
async function dbConnect(){if(U.role!="dev")return;const b=dbBase(),oa=API,on=NODB,oD=D,oM=DBM;API=b;NODB="";DBM="";DBMSG="Connecting...";render();await load();
if(DBM){localStorage.setItem("sp_api",b);localStorage.removeItem("sp_nodb");DBMSG="Connected to "+b+". The portal now reads from and saves to this database.";afterSwap()}else{API=oa;NODB=on;D=oD;DBM=oM;DBMSG="Could not connect to "+b+". Check the address and that server.py is running.";render()}}
function dbOff(){if(U.role!="dev")return;if(!confirm("Disconnect? This device will keep a copy but stop sharing records."))return;API="";NODB="1";localStorage.removeItem("sp_api");localStorage.setItem("sp_nodb","1");DBM="";DBMSG="Disconnected. Records are now kept on this device only.";render()}
async function dbPull(){if(U.role!="dev")return;await load();DBMSG="Loaded the latest records from the database.";afterSwap()}
async function dbPush(){if(U.role!="dev")return;if(!confirm("Overwrite the database with the data on this device ("+D.pupils.length+" pupils)?"))return;try{await put(DBM);SYNC="ok";DBMSG="The database now matches this device."}catch(e){DBMSG="Could not save to the database."}render()}
function dbExport(){if(U.role!="dev")return;const b=new Blob([JSON.stringify(D,null,1)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="school-backup-"+iso(new Date())+".json";document.body.appendChild(a);a.click();a.remove()}
function dbImport(){if(U.role!="dev")return;const f=$("#dbf").files[0];if(!f)return;const r=new FileReader();r.onload=()=>{let j;try{j=JSON.parse(r.result);if(!j.cfg||!j.pupils||!j.staff)throw 0}catch(e){alert("That file is not a valid school backup.");return}
if(!confirm("Replace all current data ("+D.pupils.length+" pupils) with this backup ("+j.pupils.length+" pupils)?"))return;D=j;fix();save();DBMSG="Backup restored.";afterSwap()};r.readAsText(f)}
function blockUnpaid(){D.pupils.forEach(p=>{if(due(p)>0)p.blocked=true});save();render()}
applyTheme();matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{if(!localStorage.getItem("sp_theme"))applyTheme()});load().then(applyCfg);
